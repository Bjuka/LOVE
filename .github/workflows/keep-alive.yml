# ============================================================
# SANCTUARY · Supabase keep-alive (v2)
# ------------------------------------------------------------
# Why: Supabase pauses FREE-tier projects after 7 days of no
# API activity. This workflow pings the project daily so the
# timer never expires — no Pro plan needed.
#
# What it does:
#   1. REST ping  → touches PostgREST + Postgres (counts as DB
#      activity). HTTP 401/403 is EXPECTED: RLS correctly blocks
#      anonymous reads. Any response = alive.
#   2. Auth ping  → checks the auth service health endpoint.
#   3. Each ping retries once after 30s → transient GitHub/
#      network blips don't create false-alarm failure emails.
#   4. ANTI-DISABLE: GitHub auto-disables scheduled workflows on
#      public repos after ~60 days with no commits. When main is
#      older than 40 days, this workflow pushes an EMPTY commit
#      ("chore: keepalive") as github-actions[bot] to reset that
#      timer. Zero file changes; only fires ~every 40+ days.
#
# If the project becomes unreachable the job FAILS and GitHub
# emails you — restore with one click: https://supabase.com/dashboard
# ============================================================

name: Supabase keep-alive

on:
  schedule:
    # Daily at 03:17 UTC (odd minute = avoids top-of-hour load)
    - cron: "17 3 * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write # needed only for the anti-disable empty commit

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://idlhbjoxxskzmvzrhjpb.supabase.co' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_0NiaQQkwoIcttLrvBEzAqg_t5vaBgAY' }}
    steps:
      - name: Check out repo (for the anti-disable step)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ping REST API (real DB activity)
        run: |
          ping() {
            curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              "$SUPABASE_URL/rest/v1/memories?select=*&limit=1"
          }
          code=$(ping); echo "REST attempt 1: HTTP $code"
          case "$code" in 200|401|403) ok=1;; *) sleep 30; code=$(ping); echo "REST attempt 2: HTTP $code";; esac
          case "$code" in
            200|401|403) echo "✅ Project awake (RLS blocked anon read as expected — still counts as activity)" ;;
            *) echo "::error::Unexpected HTTP $code from REST — project may be PAUSED. Restore at https://supabase.com/dashboard"; exit 1 ;;
          esac

      - name: Ping Auth service
        run: |
          ping() {
            curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              "$SUPABASE_URL/auth/v1/health"
          }
          code=$(ping); echo "Auth attempt 1: HTTP $code"
          case "$code" in 200) ok=1;; *) sleep 30; code=$(ping); echo "Auth attempt 2: HTTP $code";; esac
          case "$code" in
            200) echo "✅ Auth service healthy" ;;
            *)   echo "::error::Auth health HTTP $code — project may be PAUSED. Restore at https://supabase.com/dashboard"; exit 1 ;;
          esac

      - name: Anti-disable — reset GitHub's 60-day inactivity timer if needed
        if: success()
        run: |
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          AGE=$(( (NOW - LAST) / 86400 ))
          echo "Last commit on main is ${AGE} day(s) old"
          if [ "$AGE" -ge 40 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive — reset workflow inactivity timer"
            git push
            echo "✓ pushed empty keepalive commit (resets the 60-day disable clock)"
          else
            echo "• under 40 days — no keepalive commit needed"
          fi
